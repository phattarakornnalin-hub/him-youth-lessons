<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIM YOUTH — จัดการบทเรียน</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-style.css">
</head>
<body>

<header class="admin-header">
  <div class="wrap">
    <h1>HIM YOUTH THAILAND — จัดการบทเรียน</h1>
    <div class="header-actions">
      <button id="import-btn" class="btn btn-secondary">📥 นำเข้า JSON</button>
      <button id="export-btn" class="btn btn-secondary">📤 ส่งออก JSON</button>
      <a href="index.html" class="btn btn-secondary">👁️ ดูเว็บไซต์</a>
    </div>
  </div>
</header>

<main class="wrap admin-main">

  <section class="panel">
    <div style="background: #e8f5e9; padding: 12px; border-radius: 4px; margin-bottom: 20px; color: #2d7a3e; font-size: 0.95rem;">
      ✅ <strong>ทำงานแบบ Real-time</strong> — บทเรียนที่บันทึกจะแสดงบน index.html ทันที (ไม่ต้อง Export หรือ Reload)
    </div>
    <h2>สร้างบทเรียนใหม่</h2>
    <form id="lesson-form" class="lesson-form">
      <div class="form-row">
        <div class="form-group">
          <label for="lesson-title">ชื่อบทเรียน:</label>
          <input type="text" id="lesson-title" placeholder="เช่น ผู้นำที่รับใช้" required>
        </div>

        <div class="form-group">
          <label for="lesson-category">หมวดหมู่:</label>
          <input type="text" id="lesson-category" placeholder="เช่น การเป็นผู้นำ" list="categories" required>
          <datalist id="categories"></datalist>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="lesson-date">วันที่:</label>
          <input type="date" id="lesson-date" required>
        </div>
      </div>

      <div class="form-group">
        <label for="lesson-excerpt">สรุปสั้น ๆ:</label>
        <input type="text" id="lesson-excerpt" placeholder="บรรยายสั้น ๆ เกี่ยวกับบทเรียน" required>
      </div>

      <div class="form-group">
        <label for="lesson-content">เนื้อหาบทเรียน (Markdown):</label>
        <textarea id="lesson-content" placeholder="# ชื่อหัวข้อ&#10;&#10;เนื้อหาของบทเรียน...&#10;&#10;## หัวข้อย่อย&#10;&#10;- จุดสำคัญที่ 1&#10;- จุดสำคัญที่ 2" required></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 บันทึกบทเรียน</button>
        <button type="reset" class="btn btn-secondary">🔄 ล้างฟอร์ม</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>บทเรียนทั้งหมด</h2>
    <div class="lessons-toolbar">
      <input type="search" id="search-lessons" placeholder="ค้นหาบทเรียน..." class="search-input">
    </div>
    <div id="lessons-list" class="lessons-list"></div>
    <p id="empty-lessons" class="empty-state" hidden>ยังไม่มีบทเรียน ให้สร้างบทเรียนใหม่ข้างบนก่อน</p>
  </section>

</main>

<footer class="admin-footer">
  <div class="wrap">
    <p>Admin Panel — จัดการบทเรียนได้ง่าย ๆ แบบ Markdown</p>
  </div>
</footer>

<!-- Hidden file input for import -->
<input type="file" id="import-file" accept=".json" style="display: none;">

<script src="admin.js"></script>
</body>
</html>
